[project]
name = "k-nearest-neighbors"
version = "0.1.0"
description = "Nearest-neighbor API built on the BallTree analysis (haversine, two coordinate lists)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "numpy>=2.5.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "scikit-learn>=1.5.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "jupyter>=1.0.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
extend = "../agent-dev-harness/python-styleguide/ruff-base.toml"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
strict = true
# Same loose paths as the lint baseline: scripts/ and .local/ are not checked.
exclude = ['(^|/)scripts/', '(^|/)\.local/']
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# These packages ship no type information.
module = ["sklearn.*"]
ignore_missing_imports = true
