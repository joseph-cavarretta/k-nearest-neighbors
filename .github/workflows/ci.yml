name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repo
    steps:
      - uses: actions/checkout@v7
        with:
          path: repo

      # pyproject.toml extends the shared lint baseline by relative path, so check
      # agent-dev-harness out next to this repo.
      - uses: actions/checkout@v7
        with:
          repository: joseph-cavarretta/agent-dev-harness
          path: agent-dev-harness

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: repo/uv.lock

      - name: Install project (validates lockfile)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format
        run: uv run --no-sync ruff format --check .

      - name: Docstring length
        run: uv run --no-sync python ../agent-dev-harness/python-styleguide/docstring_length.py .

      - name: Mypy
        run: uv run --no-sync mypy .

      - name: Pytest
        run: uv run --no-sync pytest


  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t knn-api .

      - name: Smoke test container
        run: |
          docker run -d --rm --name knn-api -p 8000:8000 knn-api
          for i in $(seq 1 30); do
            curl -fsS localhost:8000/readyz && break
            sleep 1
          done
          curl -fsS -X POST localhost:8000/v1/neighbors \
            -H 'Content-Type: application/json' \
            -d '{"query_points":[{"lat":40.0,"lon":-105.3}],"reference_points":[{"lat":39.7,"lon":-105.0}]}'
          docker stop knn-api
